<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3e6cc">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>山行小日子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- 地圖 -->
  <section id="scrMap" class="scr on">
    <div class="sea"></div>
    <header class="mapTop">
      <div class="logo"><span>山行</span><small>小日子</small></div>
      <div class="topBtns">
        <button class="cbtn sm" data-go="album">相簿</button>
        <button class="cbtn sm" data-go="settings">設定</button>
      </div>
    </header>
    <div class="mapHint">點一座山，看看路線</div>
    <div id="mapWrap"></div>
    <div id="routeCard" class="sheet"></div>
  </section>

  <!-- 登山 -->
  <section id="scrClimb" class="scr">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="hudCard">
        <div class="row1"><b id="hName">象山</b><button id="wxChip" class="chip">晴</button></div>
        <div class="alt"><span id="hAlt">40</span><small> m</small></div>
        <div class="track"><div class="fill" id="hFill"></div><div class="walker" id="hWalker"></div></div>
        <div class="row2"><span id="hDist">0.00 / 1.5 km</span><span id="hEta"></span></div>
        <div class="stam"><span class="ico">體力</span><div class="sbar"><div id="hStam"></div></div></div>
      </div>
      <div class="radar" id="radar"></div>
    </div>
    <div id="bubble" class="bubble"></div>
    <div id="tapHint" class="tapHint">點畫面可以走快一點</div>
    <div id="gpsTag" class="gpsTag"></div>
    <nav class="dock">
      <button class="dbtn" data-go="map"><i class="i-map"></i>地圖</button>
      <button class="dbtn" id="restBtn"><i class="i-tent"></i><span>休息</span></button>
      <button class="dbtn" data-go="album"><i class="i-photo"></i>相簿</button>
      <button class="dbtn" data-go="settings"><i class="i-gear"></i>設定</button>
    </nav>
  </section>

  <!-- 廟宇 -->
  <section id="scrTemple" class="scr">
    <div class="tSky"></div>
    <header class="tTop">
      <button class="cbtn sm" id="tBack">← 回地圖</button>
      <div class="tName" id="tName">象山福德小祠</div>
    </header>
    <div class="tStage" id="tStage"></div>
    <div class="tMsg" id="tMsg">心裡默念自己的名字和想問的事，再來擲筊或求籤。</div>
    <div class="tBtns">
      <button class="cbtn" id="bIncense">上香</button>
      <button class="cbtn red" id="bBwa">擲筊</button>
      <button class="cbtn" id="bLot">求籤</button>
      <button class="cbtn" id="bStamp">蓋集印</button>
    </div>
  </section>

  <!-- 相簿 -->
  <section id="scrAlbum" class="scr">
    <header class="pTop"><button class="cbtn sm" data-back>← 返回</button><b>我的相簿</b><span></span></header>
    <div class="tabs"><button class="tab on" data-tab="photos">拍立得</button><button class="tab" data-tab="stamps">集印帳</button><button class="tab" data-tab="lots">籤詩冊</button></div>
    <div class="pBody" id="albumBody"></div>
  </section>

  <!-- 設定 -->
  <section id="scrSettings" class="scr">
    <header class="pTop"><button class="cbtn sm" data-back>← 返回</button><b>設定</b><span></span></header>
    <div class="pBody" id="setBody"></div>
  </section>

  <div id="modal" class="modal"><div class="mCard" id="mCard"></div></div>
  <div id="toast" class="toast"></div>
  <div id="rotate" class="rotate"><div>把手機轉成直的玩比較舒服喔</div></div>
</div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/clay.js"></script>
<script src="js/scene.js"></script>
<script src="js/game.js"></script>
</body>
</html>
