<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3e6cc">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/shiba-180.png">
<link rel="icon" href="icons/shiba-192.png">
<title>山行小日子</title>
<link rel="stylesheet" href="css/fonts.css?v=141">
<link rel="stylesheet" href="css/style.css?v=141">
</head>
<body>
<div id="app">
  <!-- 開場讀取畫面：美術圖載完才收起 -->
  <div id="loading" class="loading"><div class="ldBox"><div class="ldTitle">山行<small>小日子</small></div><div class="ldTrack"><span id="ldDog" class="ldDog"></span><div class="ldBar"><i id="ldFill"></i></div></div><div class="ldTip">整理背包、準備上山…</div></div></div>

  <!-- 地圖 -->
  <section id="scrMap" class="scr on">
    <div class="sea"></div>
    <header class="mapTop">
      <div class="logo"><span>山行</span><small>小日子</small></div>
    </header>
    <div class="mapHint">點木牌看介紹，拖曳移動地圖</div>
    <!-- 我的位置：左下圓形木牌（icon_locate 美術圖到了換上，game.js）；地圖選單：右下「選單」往上展開一疊木牌（由下往上：找山、每日、背包、相簿、大廳、設定、?） -->
    <button class="locBtn" id="locBtn" aria-label="我的位置"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="8.5" fill="#fff8e6" stroke="#3a2a20" stroke-width="2.4"/><path d="M16 3.5v6.5M16 22v6.5M3.5 16H10M22 16h6.5" stroke="#3a2a20" stroke-width="2.6" stroke-linecap="round"/><circle cx="16" cy="16" r="3" fill="#d4533e" stroke="#3a2a20" stroke-width="1.5"/></svg></button>
    <div class="mnShade" id="mnShade"></div>
    <div class="mapMenu" id="mapMenu">
      <div class="mnList" id="mnList">
        <button class="cbtn sm qBtn" data-go="help" aria-label="新手教學">?</button>
        <button class="cbtn sm" data-go="settings">設定</button>
        <button class="cbtn sm" data-go="lobby">大廳</button>
        <button class="cbtn sm" data-go="album">相簿</button>
        <button class="cbtn sm" data-go="bag">背包</button>
        <button class="cbtn sm" data-go="daily">每日</button>
        <button class="cbtn sm" data-go="find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6" fill="#fff8e6" stroke="#3a2a20" stroke-width="2.2"/><path d="M14.5 14.5 20 20" stroke="#3a2a20" stroke-width="3" stroke-linecap="round"/></svg>找山</button>
      </div>
      <div class="mnBtnW"><button class="cbtn mnBtn" id="mnBtn" aria-expanded="false" aria-controls="mnList">選單</button><i class="mnGlow"></i></div>
    </div>
    <div id="mapWrap"></div>
    <div id="routeCard" class="sheet infoCard"></div>
  </section>

  <!-- 登山 -->
  <section id="scrClimb" class="scr">
    <canvas id="cv"></canvas>
    <div class="hud" id="hudRoot"></div>
    <div id="bubble" class="bubble"></div>
    <button id="propTag" class="tag" style="display:none"></button>
    <div id="tapHint" class="tapHint">長按畫面走快一點</div>
    <div id="gpsTag" class="gpsTag"></div>
    <button id="hudTog" class="hudTog" aria-label="收起畫面資訊"></button><button id="restBtn" class="cbtn sm restBtn">休息</button>
    <nav class="dock">
      <button class="dbtn" data-go="map"><i class="i-map"></i>地圖</button>
      <button class="dbtn" data-go="bag"><i class="i-bag"></i>背包</button>
      <button class="dbtn" data-go="album"><i class="i-photo"></i>相簿</button>
      <button class="dbtn" id="frBtn"><i class="i-friend"></i>好友</button>
      <button class="dbtn" data-go="settings"><i class="i-gear"></i>設定</button>
    </nav>
    <!-- 好友視窗：按下方「好友」從下面滑上來，登山客照樣走（social.js frOpen；內容跟大廳好友分頁同一份 friendsHtml） -->
    <div id="frShade" class="frShade"></div>
    <div id="frSheet" class="frSheet" role="dialog" aria-label="好友">
      <div class="frHead"><button class="cbtn sm" id="frX">← 返回</button><b>好友</b><span></span></div>
      <div class="frBody" id="frBody"></div>
    </div>
    <div id="restSheet">
      <h4 id="rsTitle">要休息一下嗎？</h4>
      <div class="rsBtns">
        <button class="cbtn" id="rsPhoto">拍風景照</button>
        <button class="cbtn" id="rsStone">疊石許願</button>
        <button class="cbtn" id="rsUp">上傳照片</button>
        <button class="cbtn go" id="rsGo">繼續出發</button>
      </div>
    </div>
  </section>

  <!-- 山友大廳 -->
  <section id="scrLobby" class="scr">
    <header class="pTop"><button class="cbtn sm" data-go="map">← 地圖</button><b>山友大廳</b><span id="lbOnline" class="tiny"></span></header>
    <div class="tabs"><button class="tab on" data-lt="plaza">廣場</button><button class="tab" data-lt="friends">好友</button><button class="tab" data-lt="me">我的帳號</button></div>
    <div class="pBody" id="lobbyBody"></div>
  </section>

  <!-- 相簿 -->
  <section id="scrAlbum" class="scr">
    <header class="pTop"><button class="cbtn sm" data-back>← 返回</button><b>我的相簿</b><span></span></header>
    <div class="tabs tabsGrid"><button class="tab on" data-tab="photos">拍立得</button><button class="tab" data-tab="wall">照片牆</button><button class="tab" data-tab="stamps">集印帳</button><button class="tab" data-tab="baiyue">百岳帳</button><button class="tab" data-tab="badges">徽章</button><button class="tab" data-tab="enc">奇遇圖鑑</button></div>
    <div class="pBody" id="albumBody"></div>
  </section>

  <!-- 設定 -->
  <section id="scrSettings" class="scr">
    <header class="pTop"><button class="cbtn sm" data-back>← 返回</button><b>設定</b><span></span></header>
    <div class="pBody" id="setBody"></div>
  </section>

  <div id="modal" class="modal"><div class="mCard" id="mCard"></div></div>
  <div id="toast" class="toast"></div>
  <div id="rotate" class="rotate"><div>手機轉成直的，玩起來比較舒服</div></div>
  <input type="file" id="upFile" accept="image/*" hidden>
</div>

<script src="js/data.js?v=141"></script>
<script src="js/motion.js?v=141"></script>
<script src="js/audio.js?v=141"></script>
<script src="js/clay.js?v=141"></script>
<script src="js/artgroups.js?v=141"></script>
<script src="js/art.js?v=141"></script>
<script src="js/gl2d.js?v=141"></script>
<script src="js/look.js?v=141"></script>
<script src="js/trail.js?v=141"></script>
<script src="js/worldmap.js?v=141"></script>
<script src="js/hud.js?v=141"></script>
<script src="js/mtload.js?v=141"></script>
<script src="js/game.js?v=141"></script>
<script src="js/config.js?v=141"></script>
<script src="js/plaza.js?v=141"></script>
<script src="js/social.js?v=141"></script>
<script src="js/maint.js?v=141"></script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
