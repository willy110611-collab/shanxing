<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3e6cc">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>山行小日子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
<div id="app">

  <!-- 地圖 -->
  <section id="scrMap" class="scr on">
    <div class="sea"></div>
    <header class="mapTop">
      <div class="logo"><span>山行</span><small>小日子</small></div>
      <div class="topBtns">
        <button class="cbtn sm" data-go="lobby">大廳</button>
        <button class="cbtn sm" data-go="daily">每日</button>
        <button class="cbtn sm" data-go="bag">背包</button>
        <button class="cbtn sm" data-go="album">相簿</button>
        <button class="cbtn sm" data-go="settings">設定</button>
      </div>
    </header>
    <div class="mapHint">點一座山看路線，拖曳可以移動地圖</div>
    <div id="mapWrap"></div>
    <div id="routeCard" class="sheet infoCard"></div>
  </section>

  <!-- 登山 -->
  <section id="scrClimb" class="scr">
    <canvas id="cv"></canvas>
    <div class="hud" id="hudRoot"></div>
    <div id="bubble" class="bubble"></div>
    <button id="propTag" class="tag" style="display:none"></button>
    <div id="tapHint" class="tapHint">長按畫面可以走快一點</div>
    <div id="gpsTag" class="gpsTag"></div>
    <nav class="dock">
      <button class="dbtn" data-go="map"><i class="i-map"></i>地圖</button>
      <button class="dbtn" data-go="bag"><i class="i-bag"></i>背包</button>
      <button class="dbtn" data-go="album"><i class="i-photo"></i>相簿</button>
      <button class="dbtn" data-go="settings"><i class="i-gear"></i>設定</button>
    </nav>
    <div id="restSheet">
      <h4 id="rsTitle">要休息一下嗎？</h4>
      <div class="rsBtns" style="grid-template-columns:1fr 1fr">
        <button class="cbtn" id="rsPhoto">拍張風景照<small>收進相簿</small></button>
        <button class="cbtn" id="rsStone">疊石頭許願<small>留下一座小石堆</small></button>
        <button class="cbtn" id="rsUp">上傳這裡的照片<small>給之後的山友看</small></button>
        <button class="cbtn go" id="rsGo">繼續出發<small>體力和體溫回來了</small></button>
      </div>
    </div>
  </section>

  <!-- 廟宇 -->
  <section id="scrTemple" class="scr">
    <div class="tSky"></div>
    <header class="tTop">
      <button class="cbtn sm" id="tBack">← 回地圖</button>
      <div class="tName" id="tName">象山福德小祠</div>
    </header>
    <div class="tStage" id="tStage"></div>
    <div class="tMsg" id="tMsg">心裡默念自己的名字和想問的事，再來擲筊或求籤。</div>
    <div class="tBtns">
      <button class="cbtn" id="bIncense">上香</button>
      <button class="cbtn red" id="bBwa">擲筊</button>
      <button class="cbtn" id="bLot">求籤</button>
      <button class="cbtn" id="bStamp">蓋集印</button>
    </div>
  </section>

  <!-- 山友大廳 -->
  <section id="scrLobby" class="scr">
    <header class="pTop"><button class="cbtn sm" data-go="map">← 地圖</button><b>山友大廳</b><span id="lbOnline" class="tiny"></span></header>
    <div class="tabs"><button class="tab on" data-lt="chat">聊天</button><button class="tab" data-lt="friends">好友</button><button class="tab" data-lt="me">我的帳號</button></div>
    <div class="pBody" id="lobbyBody"></div>
  </section>

  <!-- 相簿 -->
  <section id="scrAlbum" class="scr">
    <header class="pTop"><button class="cbtn sm" data-back>← 返回</button><b>我的相簿</b><span></span></header>
    <div class="tabs"><button class="tab on" data-tab="photos">拍立得</button><button class="tab" data-tab="wall">照片牆</button><button class="tab" data-tab="stamps">集印帳</button><button class="tab" data-tab="lots">籤詩冊</button></div>
    <div class="pBody" id="albumBody"></div>
  </section>

  <!-- 設定 -->
  <section id="scrSettings" class="scr">
    <header class="pTop"><button class="cbtn sm" data-back>← 返回</button><b>設定</b><span></span></header>
    <div class="pBody" id="setBody"></div>
  </section>

  <div id="modal" class="modal"><div class="mCard" id="mCard"></div></div>
  <div id="toast" class="toast"></div>
  <div id="rotate" class="rotate"><div>把手機轉成直的玩比較舒服喔</div></div>
  <input type="file" id="upFile" accept="image/*" hidden>
</div>

<script src="js/data.js?v=8"></script>
<script src="js/audio.js?v=8"></script>
<script src="js/clay.js?v=8"></script>
<script src="js/trail.js?v=8"></script>
<script src="js/worldmap.js?v=8"></script>
<script src="js/hud.js?v=8"></script>
<script src="js/game.js?v=8"></script>
<script src="js/social.js?v=8"></script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
